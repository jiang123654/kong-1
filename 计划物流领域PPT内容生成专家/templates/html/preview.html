<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{REPORT_TITLE}} - PPT内容预览</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-title">{{REPORT_TITLE}}</div>
    <div class="topbar-actions">
      <button class="btn btn-icon" id="panel-btn" title="折叠/展开面板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
      <button class="btn" id="prev-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        上一页
      </button>
      <button class="btn" id="next-btn">
        下一页
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        导出
      </button>
    </div>
  </header>

  <!-- 左侧缩略图导航 -->
  <aside class="sidebar">
    <div class="thumb-list" id="thumb-list">
      <!-- 由JS动态生成 -->
    </div>
  </aside>

  <!-- 右侧信息面板 -->
  <aside class="right-panel" id="right-panel">
    <div class="panel-section" id="audit-section">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        审计合规检查
        <span class="badge-count">0</span>
      </div>
      <div class="panel-content"></div>
    </div>
    <div class="panel-section" id="question-section">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        动态追问清单
        <span class="badge-count">0</span>
      </div>
      <div class="panel-content"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        操作说明
      </div>
      <div class="panel-content" style="font-size:12px; color:var(--gray-500); line-height:1.8;">
        • 左右键切换页面<br>
        • 点击左侧缩略图快速跳转<br>
        • 点击折叠按钮收起面板<br>
        • 悬浮图表查看详细数据
      </div>
    </div>
  </aside>

  <!-- 主预览区 -->
  <main class="main-content">
    <div class="slide-container" id="slide-container">
      <!-- 由JS动态生成 -->
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // 数据注入点：由生成器替换
    const pptData = {{PPT_DATA_JSON}};
    
    // 初始化预览器
    document.addEventListener('DOMContentLoaded', function() {
      if (window.PPTPreviewer && pptData) {
        new PPTPreviewer(pptData);
      }
    });
  </script>
</body>
</html>
